<!DOCTYPE html>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#2563eb">
    <title>OCR対応 PDFコンバーター</title>
    <!-- ファビコン（インラインSVG） -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' fill='%232563eb' rx='6' /%3E%3Cpath fill='none' stroke='%23ffffff' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M9 12h6m-6 4h6m2 5H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5.586a1 1 0 0 1 .707.293l5.414 5.414a1 1 0 0 1 .293.707V19a2 2 0 0 1-2 2z'/%3E%3C/svg%3E">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tesseract.js -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <!-- pdf-lib (PDF直接生成用) -->
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <!-- fontkit (日本語フォント埋め込み用) -->
    <script src="https://unpkg.com/@pdf-lib/fontkit@1.1.1/dist/fontkit.umd.js"></script>
    <!-- PDF.js (PDFファイル読み込み・画像化用) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>
        // PDF.jsのワーカーを設定
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        #preview-container {
            position: relative;
            display: inline-block;
            max-width: 100%;
        }
        #preview-image {
            display: block;
            max-width: 100%;
            height: auto;
        }
        .highlight-box {
            position: absolute;
            border: 2px solid rgba(59, 130, 246, 0.5); /* Tailwind blue-500 with opacity */
            background-color: rgba(59, 130, 246, 0.1);
            pointer-events: none;
            box-sizing: border-box;
        }
        /* スクロールバーのカスタマイズ */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
        /* スピナーアニメーション */
        .spinner {
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top: 3px solid #fff;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-50 min-h-screen p-4 md:p-8 flex flex-col items-center">

    <!-- ヘッダー -->
    <div class="max-w-4xl w-full mb-8 text-center">
        <h1 class="text-3xl font-bold text-gray-800 mb-2">OCR対応 PDFコンバーター</h1>
        <p class="text-gray-600">画像や既存のPDFを読み込み、テキストを検索・コピー可能なPDFに変換します。</p>
    </div>

    <!-- メインコンテンツ -->
    <div class="max-w-4xl w-full bg-white rounded-2xl shadow-xl overflow-hidden p-6 md:p-8">
        
        <!-- コントロールパネル -->
        <div class="flex flex-col md:flex-row justify-between items-center mb-6 pb-6 border-b border-gray-100 gap-4">
            
            <!-- オプション設定 -->
            <div class="flex items-center space-x-6 bg-gray-50 px-4 py-3 rounded-lg w-full md:w-auto">
                <span class="text-sm font-semibold text-gray-700">読み取り方向:</span>
                <label class="flex items-center cursor-pointer">
                    <input type="radio" name="readDirection" value="jpn+eng" class="w-4 h-4 text-blue-600 focus:ring-blue-500" checked>
                    <span class="ml-2 text-sm text-gray-700">横書き (日英混在)</span>
                </label>
                <label class="flex items-center cursor-pointer">
                    <input type="radio" name="readDirection" value="jpn_vert" class="w-4 h-4 text-blue-600 focus:ring-blue-500">
                    <span class="ml-2 text-sm text-gray-700">縦書き (日本語)</span>
                </label>
            </div>

            <!-- やり直しボタン -->
            <button id="btn-reset" class="text-sm text-gray-500 hover:text-red-500 flex items-center transition-colors hidden">
                <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                最初からやり直す
            </button>
        </div>

        <!-- アップロードエリア -->
        <div id="upload-area" class="border-2 border-dashed border-gray-300 rounded-xl p-12 text-center hover:bg-gray-50 transition-colors cursor-pointer flex flex-col items-center justify-center min-h-[300px]">
            <svg class="w-16 h-16 text-gray-400 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
            <p class="text-lg font-medium text-gray-700 mb-2">画像またはPDFをドラッグ＆ドロップ</p>
            <p class="text-sm text-gray-500 mb-6">対応フォーマット: JPG, PNG, PDF</p>
            <input type="file" id="file-input" accept="image/*, application/pdf" class="hidden">
            <button class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-6 rounded-lg transition-colors shadow-sm" onclick="document.getElementById('file-input').click()">
                ファイルを選択
            </button>
        </div>

        <!-- プレビュー＆処理エリア (初期非表示) -->
        <div id="processing-area" class="hidden flex flex-col gap-6">
            
            <div class="flex flex-col md:flex-row gap-6">
                <!-- 左側：画像プレビュー -->
                <div class="w-full md:w-2/3 bg-gray-100 rounded-xl p-4 overflow-auto max-h-[600px] flex justify-center items-start border border-gray-200">
                    <div id="preview-container">
                        <img id="preview-image" src="" alt="プレビュー" class="shadow-sm">
                        <!-- ここにハイライト用のdivが追加されます -->
                    </div>
                </div>

                <!-- 右側：コントロール＆結果 -->
                <div class="w-full md:w-1/3 flex flex-col gap-4">
                    
                    <button id="btn-run-ocr" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl transition-colors shadow-md flex justify-center items-center">
                        OCRを実行する
                    </button>

                    <!-- プログレス表示 -->
                    <div id="progress-container" class="hidden flex flex-col gap-2 p-4 bg-blue-50 rounded-lg border border-blue-100">
                        <div class="flex justify-between items-center text-sm font-medium text-blue-800">
                            <span id="progress-text">準備中...</span>
                            <span id="progress-percent">0%</span>
                        </div>
                        <div class="w-full bg-blue-200 rounded-full h-2.5">
                            <div id="progress-bar" class="bg-blue-600 h-2.5 rounded-full" style="width: 0%"></div>
                        </div>
                    </div>

                    <!-- 抽出テキスト表示エリア -->
                    <div id="result-text-area" class="hidden flex-col gap-2 h-full flex-grow">
                        <label class="text-sm font-semibold text-gray-700 flex justify-between items-center">
                            抽出されたテキスト (プレビュー)
                            <span class="text-xs font-normal text-gray-500 bg-gray-100 px-2 py-1 rounded">編集可能</span>
                        </label>
                        <textarea id="extracted-text" class="w-full flex-grow p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm resize-none min-h-[200px]" placeholder="ここに抽出されたテキストが表示されます"></textarea>
                        
                        <div class="flex gap-2 mt-2">
                            <button id="btn-copy" class="flex-1 bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 font-medium py-2 px-4 rounded-lg transition-colors text-sm">
                                テキストのみコピー
                            </button>
                            <button id="btn-save-pdf" class="flex-1 bg-green-600 hover:bg-green-700 text-white font-medium py-2 px-4 rounded-lg transition-colors text-sm shadow-sm flex justify-center items-center">
                                <span id="pdf-btn-text">OCR対応PDFを保存</span>
                            </button>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script>
        const uploadArea = document.getElementById('upload-area');
        const fileInput = document.getElementById('file-input');
        const processingArea = document.getElementById('processing-area');
        const previewImage = document.getElementById('preview-image');
        const previewContainer = document.getElementById('preview-container');
        const btnRunOcr = document.getElementById('btn-run-ocr');
        const progressContainer = document.getElementById('progress-container');
        const progressText = document.getElementById('progress-text');
        const progressPercent = document.getElementById('progress-percent');
        const progressBar = document.getElementById('progressBar');
        const resultTextArea = document.getElementById('result-text-area');
        const extractedText = document.getElementById('extracted-text');
        const btnCopy = document.getElementById('btn-copy');
        const btnSavePdf = document.getElementById('btn-save-pdf');
        const pdfBtnText = document.getElementById('pdf-btn-text');
        const btnReset = document.getElementById('btn-reset');
        const radioDirections = document.querySelectorAll('input[name="readDirection"]');

        let currentFile = null;
        let isImageLoaded = false;
        
        // PDF処理用
        let isPdfMode = false;
        let uploadedPdfBytes = null; // 元のPDFファイルのバイナリ
        let pdfPagesImages = []; // PDFの各ページをCanvas化したもの
        
        let ocrResultData = null; // 単一画像の場合の結果
        let pdfOcrResults = [];   // PDF複数ページの場合の結果配列

        // リセット機能
        btnReset.addEventListener('click', () => {
            currentFile = null;
            isImageLoaded = false;
            isPdfMode = false;
            uploadedPdfBytes = null;
            pdfPagesImages = [];
            ocrResultData = null;
            pdfOcrResults = [];
            
            previewImage.src = '';
            extractedText.value = '';
            
            // ハイライト削除
            document.querySelectorAll('.highlight-box').forEach(el => el.remove());
            
            uploadArea.classList.remove('hidden');
            processingArea.classList.add('hidden');
            resultTextArea.classList.add('hidden');
            progressContainer.classList.add('hidden');
            btnRunOcr.disabled = false;
            btnRunOcr.classList.remove('opacity-50', 'cursor-not-allowed');
            btnReset.classList.add('hidden');
            
            fileInput.value = '';
        });

        // ドラッグ＆ドロップイベント
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('border-blue-500', 'bg-blue-50');
        });
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('border-blue-500', 'bg-blue-50');
        });
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('border-blue-500', 'bg-blue-50');
            if (e.dataTransfer.files.length > 0) {
                handleFile(e.dataTransfer.files[0]);
            }
        });

        // ファイル選択イベント
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        async function handleFile(file) {
            if (!file) return;
            currentFile = file;
            isPdfMode = file.type === 'application/pdf';
            btnReset.classList.remove('hidden');

            uploadArea.classList.add('hidden');
            processingArea.classList.remove('hidden');
            resultTextArea.classList.add('hidden');
            progressContainer.classList.add('hidden');
            document.querySelectorAll('.highlight-box').forEach(el => el.remove());

            if (isPdfMode) {
                // PDFファイルの読み込み（プレビュー用）
                try {
                    const arrayBuffer = await file.arrayBuffer();
                    uploadedPdfBytes = arrayBuffer;
                    const loadingTask = pdfjsLib.getDocument({ data: new Uint8Array(arrayBuffer) });
                    const pdf = await loadingTask.promise;
                    
                    // 最初のページをプレビュー表示
                    const page = await pdf.getPage(1);
                    const viewport = page.getViewport({ scale: 1.5 });
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = viewport.width;
                    canvas.height = viewport.height;
                    
                    await page.render({ canvasContext: ctx, viewport: viewport }).promise;
                    
                    previewImage.onload = () => { isImageLoaded = true; };
                    previewImage.src = canvas.toDataURL('image/jpeg', 0.8);
                } catch (error) {
                    console.error("PDF preview error:", error);
                    alert("PDFのプレビュー生成に失敗しました。");
                }
            } else {
                // 画像ファイルの読み込み
                const reader = new FileReader();
                reader.onload = (e) => {
                    previewImage.onload = () => { isImageLoaded = true; };
                    previewImage.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        // 日本語文字列に含まれる不要な半角スペースをループで徹底的に除去する関数
        function removeUnnaturalSpaces(text) {
            let previousText = "";
            let currentText = text;

            // 変化がなくなるまで置換を繰り返す（「あ い う」→「あいう」へ完全に結合するため）
            while (currentText !== previousText) {
                previousText = currentText;
                
                // 1. 全角文字（漢字・ひらがな・カタカナ・全角記号）と全角文字の間にある半角スペースを削除
                currentText = currentText.replace(/([^\x01-\x7E\xA1-\xDF])\s+([^\x01-\x7E\xA1-\xDF])/g, '$1$2');
                
                // 2. 全角文字と半角英数字の間にある半角スペースを削除（オプション。残したい場合はコメントアウト）
                currentText = currentText.replace(/([^\x01-\x7E\xA1-\xDF])\s+([a-zA-Z0-9])/g, '$1$2');
                currentText = currentText.replace(/([a-zA-Z0-9])\s+([^\x01-\x7E\xA1-\xDF])/g, '$1$2');
            }

            // 3. 行頭、行末のスペースを削除
            currentText = currentText.replace(/^\s+/gm, '').replace(/\s+$/gm, '');
            // 4. 句読点の周りのスペースを削除
            currentText = currentText.replace(/\s*([。、，．])\s*/g, '$1');

            return currentText;
        }

        btnRunOcr.addEventListener('click', async () => {
            if (isPdfMode) {
                if (!uploadedPdfBytes) return;
            } else {
                if (!isImageLoaded) return;
            }

            // UI更新
            btnRunOcr.disabled = true;
            btnRunOcr.classList.add('opacity-50', 'cursor-not-allowed');
            progressContainer.classList.remove('hidden');
            resultTextArea.classList.add('hidden');
            document.querySelectorAll('.highlight-box').forEach(el => el.remove());
            
            // 選択された言語設定を取得
            let selectedLang = 'jpn+eng';
            radioDirections.forEach(radio => {
                if (radio.checked) selectedLang = radio.value;
            });

            let worker = null;
            
            try {
                // Tesseract v4の正しい初期化方法 (非同期)
                progressText.textContent = 'OCRエンジンを読み込み中...';
                worker = await Tesseract.createWorker({
                    logger: m => {
                        if (m.status === 'recognizing text') {
                            const progress = Math.round(m.progress * 100);
                            document.getElementById('progress-bar').style.width = `${progress}%`;
                            progressPercent.textContent = `${progress}%`;
                        }
                    }
                });
                
                progressText.textContent = '辞書データを準備中...';
                await worker.loadLanguage(selectedLang);
                await worker.initialize(selectedLang);

                if (isPdfMode) {
                    // --- PDF（複数ページ）のOCR処理 ---
                    const loadingTask = pdfjsLib.getDocument({ data: new Uint8Array(uploadedPdfBytes) });
                    const pdf = await loadingTask.promise;
                    const numPages = pdf.numPages;
                    pdfPagesImages = [];
                    pdfOcrResults = [];
                    let combinedText = '';

                    for (let i = 1; i <= numPages; i++) {
                        progressText.textContent = `ページ ${i}/${numPages} を処理中...`;
                        
                        const page = await pdf.getPage(i);
                        const scale = 2.0; // 認識精度向上のためのスケール
                        const viewport = page.getViewport({ scale: scale });
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        canvas.width = viewport.width;
                        canvas.height = viewport.height;
                        
                        await page.render({ canvasContext: ctx, viewport: viewport }).promise;
                        pdfPagesImages.push(canvas); // PDF生成時用にCanvasを保存
                        
                        // 画像データをTesseractへ (v4仕様に変更)
                        const ret = await worker.recognize(canvas);
                        
                        pdfOcrResults.push(ret);
                        
                        // 信頼度に基づくテキストフィルタリングとスペース除去
                        let pageText = '';
                        if (ret.data && ret.data.lines) {
                            ret.data.lines.forEach(line => {
                                let validWords = line.words.filter(w => w.confidence >= 40);
                                if (validWords.length > 0) {
                                    let rawLineText = validWords.map(w => w.text).join(' ');
                                    pageText += removeUnnaturalSpaces(rawLineText) + '\n';
                                }
                            });
                        }
                        combinedText += `--- ページ ${i} ---\n${pageText}\n`;
                    }
                    
                    extractedText.value = combinedText;
                    // PDFモードではプレビュー上へのハイライト描画は省略（または1ページ目のみにする等）

                } else {
                    // --- 画像（単一ページ）のOCR処理 ---
                    progressText.textContent = '文字を認識中...';
                    
                    // 画像データをTesseractへ (v4仕様に変更)
                    const ret = await worker.recognize(previewImage);
                    
                    ocrResultData = ret;
                    
                    // ハイライト描画とテキスト抽出（信頼度フィルター適用）
                    const imageRect = previewImage.getBoundingClientRect();
                    const scaleX = imageRect.width / previewImage.naturalWidth;
                    const scaleY = imageRect.height / previewImage.naturalHeight;
                    
                    let finalExtractedText = "";

                    if (ret.data && ret.data.lines) {
                        ret.data.lines.forEach(line => {
                            // 信頼度40未満の単語(ゴミ文字)を除外
                            let validWords = line.words.filter(w => w.confidence >= 40);
                            
                            if (validWords.length > 0) {
                                // 画面プレビュー用のハイライト枠を再計算
                                const minX = Math.min(...validWords.map(w => w.bbox.x0));
                                const minY = Math.min(...validWords.map(w => w.bbox.y0));
                                const maxX = Math.max(...validWords.map(w => w.bbox.x1));
                                const maxY = Math.max(...validWords.map(w => w.bbox.y1));

                                const box = document.createElement('div');
                                box.className = 'highlight-box rounded-sm';
                                // %指定で配置
                                box.style.left = `${(minX / previewImage.naturalWidth) * 100}%`;
                                box.style.top = `${(minY / previewImage.naturalHeight) * 100}%`;
                                box.style.width = `${((maxX - minX) / previewImage.naturalWidth) * 100}%`;
                                box.style.height = `${((maxY - minY) / previewImage.naturalHeight) * 100}%`;
                                previewContainer.appendChild(box);

                                // テキストの結合とスペースクリーニング
                                let rawLineText = validWords.map(w => w.text).join(' ');
                                finalExtractedText += removeUnnaturalSpaces(rawLineText) + "\n";
                            }
                        });
                    }
                    extractedText.value = finalExtractedText;
                }

                progressText.textContent = '完了！';
                resultTextArea.classList.remove('hidden');

            } catch (error) {
                console.error(error);
                alert('OCR処理中にエラーが発生しました。\n' + (error.message || error));
            } finally {
                if (worker) {
                    await worker.terminate();
                }
                btnRunOcr.disabled = false;
                btnRunOcr.classList.remove('opacity-50', 'cursor-not-allowed');
                // プログレスバーは数秒後に消す
                setTimeout(() => {
                    progressContainer.classList.add('hidden');
                    document.getElementById('progress-bar').style.width = '0%';
                    progressPercent.textContent = '0%';
                }, 2000);
            }
        });

        btnCopy.addEventListener('click', () => {
            extractedText.select();
            document.execCommand('copy');
            
            const originalText = btnCopy.textContent;
            btnCopy.textContent = 'コピーしました！';
            btnCopy.classList.add('text-green-600', 'bg-green-50');
            setTimeout(() => {
                btnCopy.textContent = originalText;
                btnCopy.classList.remove('text-green-600', 'bg-green-50');
            }, 2000);
        });

        
        // Canvasを安全にバイナリ配列に変換するヘルパー関数
        async function getCanvasBytes(canvas) {
            return new Promise((resolve, reject) => {
                canvas.toBlob(async (blob) => {
                    if (!blob) { reject(new Error("Canvas blob conversion failed")); return; }
                    const arrayBuffer = await blob.arrayBuffer();
                    resolve(new Uint8Array(arrayBuffer));
                }, 'image/jpeg', 0.9);
            });
        }

        btnSavePdf.addEventListener('click', async () => {
            // UI更新（ローディング表示）
            btnSavePdf.disabled = true;
            btnSavePdf.classList.add('opacity-80', 'cursor-not-allowed');
            pdfBtnText.innerHTML = '<span class="spinner"></span> 作成中...';

            try {
                // pdf-libの初期化とfontkitの登録
                const pdfDoc = await PDFLib.PDFDocument.create();
                pdfDoc.registerFontkit(window.fontkit);

                // jsDelivrからNoto Sans JPフォントを取得（安定版のURLに変更）
                const fontUrl = 'https://cdn.jsdelivr.net/npm/typeface-notosans-jp@1.0.1/NotoSansJP-Regular.otf';
                let fontBytes;
                try {
                    const fontRes = await fetch(fontUrl);
                    if (!fontRes.ok) throw new Error(`HTTP error! status: ${fontRes.status}`);
                    fontBytes = await fontRes.arrayBuffer();
                } catch (fetchErr) {
                    console.error("Font fetch error:", fetchErr);
                    throw new Error("日本語フォントのダウンロードに失敗しました。通信環境を確認してください。");
                }
                const customFont = await pdfDoc.embedFont(fontBytes);

                // --- 共通のページ生成処理関数 ---
                async function createPdfPage(pdfDoc, imgBytes, imgWidth, imgHeight, ocrResult, font) {
                    const page = pdfDoc.addPage([imgWidth, imgHeight]);
                    const pdfImage = await pdfDoc.embedJpg(imgBytes);
                    
                    // 背景として画像を描画
                    page.drawImage(pdfImage, {
                        x: 0, y: 0, width: imgWidth, height: imgHeight,
                    });

                    // 透明テキストの配置処理
                    if (ocrResult && ocrResult.data && ocrResult.data.lines) {
                        ocrResult.data.lines.forEach(line => {
                            // 自信度が低い単語を除外し、確かな単語だけを抽出
                            let validWords = line.words.filter(w => w.confidence >= 40);
                            if (validWords.length === 0) return;

                            // 今回は「行（Line）単位」ではなく、「単語（Word）単位」でループを回して配置する
                            validWords.forEach(word => {
                                // 単語のテキストを取得し、改行や不要なスペースを消す
                                let text = removeUnnaturalSpaces(word.text).replace(/\n/g, '').trim();
                                if (!text) return;

                                // 単語ごとの枠（Bounding Box）を取得
                                const bbox = word.bbox;
                                const lineWidth = bbox.x1 - bbox.x0; // 単語の画像の横幅
                                const lineHeight = bbox.y1 - bbox.y0; // 単語の画像の高さ
                                
                                // フォントサイズの設定（枠の高さベース）
                                const fontSize = lineHeight * 0.8;
                                
                                // PDFLibを使って、テキストを描画した際の「素の横幅」を計算
                                const textWidth = font.widthOfTextAtSize(text, fontSize);
                                
                                // テキストの横幅を、元の画像の認識枠の横幅にピッタリ合わせるための倍率(スケール)を計算
                                let scaleX = 1;
                                if (textWidth > 0) {
                                    scaleX = lineWidth / textWidth;
                                }
                                
                                // Y座標は下から上に向かうので高さを引く。ベースライン調整のため少し上に上げる
                                const yPos = imgHeight - bbox.y1 + (lineHeight * 0.1);

                                // グラフィックス状態を保存し、X方向の倍率（scaleX）を変更する行列を適用
                                page.pushOperators(
                                    PDFLib.pushGraphicsState(),
                                    PDFLib.concatTransformationMatrix(scaleX, 0, 0, 1, bbox.x0, yPos)
                                );

                                // テキストの描画 (透明)
                                page.drawText(text, {
                                    x: 0, // 行列変換で位置指定済みのため0
                                    y: 0,
                                    size: fontSize,
                                    font: font,
                                    color: PDFLib.rgb(0, 0, 0),
                                    opacity: 0, // 完全に透明
                                });

                                // グラフィックス状態を復元（スケールを元に戻す）
                                page.pushOperators(PDFLib.popGraphicsState());
                            });
                        });
                    }
                }

                if (isPdfMode) {
                    // --- 複数ページ（PDF）モード ---
                    for (let i = 0; i < pdfPagesImages.length; i++) {
                        const canvas = pdfPagesImages[i];
                        const result = pdfOcrResults[i];
                        const imgBytes = await getCanvasBytes(canvas);
                        await createPdfPage(pdfDoc, imgBytes, canvas.width, canvas.height, result, customFont);
                    }
                } else {
                    // --- 単一画像モード ---
                    // Image要素からCanvas経由でバイナリを取得
                    const canvas = document.createElement('canvas');
                    canvas.width = previewImage.naturalWidth;
                    canvas.height = previewImage.naturalHeight;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(previewImage, 0, 0);
                    const imgBytes = await getCanvasBytes(canvas);
                    
                    await createPdfPage(pdfDoc, imgBytes, canvas.width, canvas.height, ocrResultData, customFont);
                }

                // PDFファイルの生成とダウンロード
                const pdfBytes = await pdfDoc.save();
                const blob = new Blob([pdfBytes], { type: 'application/pdf' });
                const url = URL.createObjectURL(blob);
                
                const a = document.createElement('a');
                a.href = url;
                a.download = 'ocr_converted.pdf';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);

            } catch (error) {
                console.error('PDF Generation Error:', error);
                alert('PDFの作成中にエラーが発生しました。\n' + error.message);
            } finally {
                // ボタンの状態を元に戻す
                btnSavePdf.disabled = false;
                btnSavePdf.classList.remove('opacity-80', 'cursor-not-allowed');
                pdfBtnText.textContent = 'OCR対応PDFを保存';
            }
        });
    </script>
</body>
</html>
