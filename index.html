<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#2563eb">
    <title>OCR対応 PDFコンバーター</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tesseract.js -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <!-- pdf-lib (PDF直接生成用) -->
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <!-- fontkit (日本語フォント埋め込み用) -->
    <script src="https://unpkg.com/@pdf-lib/fontkit@1.1.1/dist/fontkit.umd.js"></script>
    <!-- PDF.js (PDFファイル読み込み・画像化用) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>
        // PDF.jsのワーカーを設定
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    </script>
    <style>
        html { -webkit-text-size-adjust: 100%; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', 'Hiragino Sans', 'Noto Sans JP', Meiryo, sans-serif;
            /* iOSのセーフエリア対応 */
            padding-bottom: env(safe-area-inset-bottom);
        }
        #preview-container {
            position: relative;
            display: inline-block;
            max-width: 100%;
        }
        #preview-image {
            display: block;
            max-width: 100%;
            height: auto;
        }
        .highlight-box {
            position: absolute;
            border: 1.5px solid rgba(37, 99, 235, 0.6);
            background-color: rgba(37, 99, 235, 0.12);
            pointer-events: none;
            box-sizing: border-box;
            border-radius: 2px;
        }
        /* スクロールバーのカスタマイズ */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        /* スピナーアニメーション */
        .spinner {
            border: 3px solid rgba(255,255,255,0.35);
            border-radius: 50%;
            border-top: 3px solid #fff;
            width: 18px;
            height: 18px;
            animation: spin 0.8s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        /* トースト */
        #toast {
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        /* セグメントコントロール（読み取り方向） */
        .seg-label input:checked + span {
            background-color: #2563eb;
            color: #fff;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
        /* タップ時のハイライトを抑制 */
        button, label, a { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-gradient-to-b from-slate-100 to-slate-200 min-h-screen">

    <div class="max-w-4xl w-full mx-auto px-4 py-6 sm:px-6 sm:py-10 flex flex-col items-center">

        <!-- ヘッダー -->
        <header class="w-full mb-6 sm:mb-8 text-center">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-blue-600 shadow-lg shadow-blue-600/30 mb-4">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
            </div>
            <h1 class="text-2xl sm:text-3xl font-bold text-slate-800 mb-2">OCR対応 PDFコンバーター</h1>
            <p class="text-sm sm:text-base text-slate-500 px-2">画像や既存のPDFを読み込み、テキストを検索・コピーできるPDFに変換します。</p>
        </header>

        <!-- メインコンテンツ -->
        <main class="w-full bg-white rounded-3xl shadow-xl shadow-slate-300/40 overflow-hidden p-4 sm:p-6 md:p-8">

            <!-- コントロールパネル -->
            <div class="flex flex-col sm:flex-row justify-between items-stretch sm:items-center mb-5 sm:mb-6 pb-5 sm:pb-6 border-b border-slate-100 gap-3 sm:gap-4">

                <!-- オプション設定：読み取り方向（セグメントコントロール） -->
                <div class="flex flex-col gap-2 w-full sm:w-auto">
                    <span class="text-xs font-semibold text-slate-500 uppercase tracking-wide">読み取り方向</span>
                    <div class="inline-flex bg-slate-100 rounded-xl p-1 gap-1">
                        <label class="seg-label flex-1 sm:flex-none cursor-pointer">
                            <input type="radio" name="readDirection" value="jpn+eng" class="sr-only" checked>
                            <span class="block text-center text-sm font-medium text-slate-600 px-4 py-2 rounded-lg transition-colors whitespace-nowrap">横書き（日英）</span>
                        </label>
                        <label class="seg-label flex-1 sm:flex-none cursor-pointer">
                            <input type="radio" name="readDirection" value="jpn_vert" class="sr-only">
                            <span class="block text-center text-sm font-medium text-slate-600 px-4 py-2 rounded-lg transition-colors whitespace-nowrap">縦書き（日本語）</span>
                        </label>
                    </div>
                </div>

                <!-- やり直しボタン -->
                <button id="btn-reset" class="hidden text-sm text-slate-500 hover:text-red-500 active:text-red-600 flex items-center justify-center gap-1.5 py-2 px-3 rounded-lg hover:bg-slate-50 transition-colors self-end sm:self-auto">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    最初からやり直す
                </button>
            </div>

            <!-- アップロードエリア -->
            <div id="upload-area" class="border-2 border-dashed border-slate-300 rounded-2xl p-6 sm:p-12 text-center hover:bg-slate-50 hover:border-blue-400 transition-colors cursor-pointer flex flex-col items-center justify-center min-h-[260px] sm:min-h-[300px]">
                <svg class="w-14 h-14 sm:w-16 sm:h-16 text-slate-300 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                <p class="text-base sm:text-lg font-semibold text-slate-700 mb-1">画像またはPDFを選択</p>
                <p class="text-xs sm:text-sm text-slate-400 mb-6">タップして選択 / ドラッグ＆ドロップ（JPG, PNG, PDF）</p>
                <input type="file" id="file-input" accept="image/*, application/pdf" class="hidden">
                <button type="button" class="bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-semibold py-3 px-8 rounded-xl transition-colors shadow-md shadow-blue-600/20 text-base" onclick="document.getElementById('file-input').click()">
                    ファイルを選択
                </button>
            </div>

            <!-- プレビュー＆処理エリア (初期非表示) -->
            <div id="processing-area" class="hidden flex-col gap-5 sm:gap-6">

                <div class="flex flex-col lg:flex-row gap-5 sm:gap-6">
                    <!-- 左側：画像プレビュー -->
                    <div class="w-full lg:w-2/3 bg-slate-100 rounded-2xl p-3 sm:p-4 overflow-auto max-h-[45vh] lg:max-h-[600px] flex justify-center items-start border border-slate-200">
                        <div id="preview-container">
                            <img id="preview-image" src="" alt="プレビュー" class="shadow-sm rounded">
                            <!-- ここにハイライト用のdivが追加されます -->
                        </div>
                    </div>

                    <!-- 右側：コントロール＆結果 -->
                    <div class="w-full lg:w-1/3 flex flex-col gap-4">

                        <button id="btn-run-ocr" class="w-full bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-bold py-3.5 px-4 rounded-xl transition-colors shadow-md shadow-blue-600/20 flex justify-center items-center text-base min-h-[52px]">
                            OCRを実行する
                        </button>

                        <!-- プログレス表示 -->
                        <div id="progress-container" class="hidden flex-col gap-2 p-4 bg-blue-50 rounded-xl border border-blue-100">
                            <div class="flex justify-between items-center text-sm font-medium text-blue-800">
                                <span id="progress-text">準備中...</span>
                                <span id="progress-percent">0%</span>
                            </div>
                            <div class="w-full bg-blue-200 rounded-full h-2.5 overflow-hidden">
                                <div id="progress-bar" class="bg-blue-600 h-2.5 rounded-full transition-all duration-200" style="width: 0%"></div>
                            </div>
                        </div>

                        <!-- 抽出テキスト表示エリア -->
                        <div id="result-text-area" class="hidden flex-col gap-2 h-full flex-grow">
                            <label class="text-sm font-semibold text-slate-700 flex justify-between items-center">
                                抽出されたテキスト
                                <span class="text-xs font-normal text-slate-500 bg-slate-100 px-2 py-1 rounded">編集可能</span>
                            </label>
                            <textarea id="extracted-text" class="w-full flex-grow p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm resize-none min-h-[180px]" placeholder="ここに抽出されたテキストが表示されます"></textarea>

                            <div class="flex flex-col sm:flex-row gap-2 mt-1">
                                <button id="btn-copy" class="flex-1 bg-white border border-slate-300 hover:bg-slate-50 active:bg-slate-100 text-slate-700 font-medium py-3 px-4 rounded-xl transition-colors text-sm min-h-[48px]">
                                    テキストをコピー
                                </button>
                                <button id="btn-save-pdf" class="flex-1 bg-green-600 hover:bg-green-700 active:bg-green-800 text-white font-semibold py-3 px-4 rounded-xl transition-colors text-sm shadow-sm shadow-green-600/20 flex justify-center items-center min-h-[48px]">
                                    <span id="pdf-btn-text">OCR対応PDFを保存</span>
                                </button>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </main>

        <p class="text-xs text-slate-400 mt-6 text-center px-4">すべての処理はブラウザ内で完結します。ファイルが外部に送信されることはありません。</p>
    </div>

    <!-- トースト通知 -->
    <div id="toast" class="fixed left-1/2 -translate-x-1/2 bottom-6 z-50 opacity-0 pointer-events-none translate-y-2 bg-slate-800 text-white text-sm font-medium px-5 py-3 rounded-xl shadow-lg max-w-[90vw] text-center" style="margin-bottom: env(safe-area-inset-bottom);"></div>

    <script>
        const uploadArea = document.getElementById('upload-area');
        const fileInput = document.getElementById('file-input');
        const processingArea = document.getElementById('processing-area');
        const previewImage = document.getElementById('preview-image');
        const previewContainer = document.getElementById('preview-container');
        const btnRunOcr = document.getElementById('btn-run-ocr');
        const progressContainer = document.getElementById('progress-container');
        const progressText = document.getElementById('progress-text');
        const progressPercent = document.getElementById('progress-percent');
        const progressBar = document.getElementById('progress-bar');
        const resultTextArea = document.getElementById('result-text-area');
        const extractedText = document.getElementById('extracted-text');
        const btnCopy = document.getElementById('btn-copy');
        const btnSavePdf = document.getElementById('btn-save-pdf');
        const pdfBtnText = document.getElementById('pdf-btn-text');
        const btnReset = document.getElementById('btn-reset');
        const toast = document.getElementById('toast');
        const radioDirections = document.querySelectorAll('input[name="readDirection"]');

        // 認識対象として採用する単語の最低信頼度
        const CONFIDENCE_THRESHOLD = 35;

        let currentFile = null;
        let isImageLoaded = false;

        // PDF処理用
        let isPdfMode = false;
        let uploadedPdfBytes = null; // 元のPDFファイルのバイナリ

        // OCR結果と、その結果の座標系スケール（元画像/描画キャンバスに対する倍率）
        // ※前処理で画像を拡大するため、bbox座標は scale で割ると元画像座標に戻る
        let ocrResultData = null;   // 単一画像の場合の結果
        let ocrResultScale = 1;     // 単一画像の場合のスケール
        let pdfPageCanvases = [];   // PDFの各ページをCanvas化したもの（PDF背景用・カラー）
        let pdfOcrResults = [];     // PDF複数ページの場合の結果配列
        let pdfOcrScales = [];      // 各ページのOCRスケール

        // 事前生成しておくPDF（スマホの共有APIをタップ直後に呼べるようにするため）
        let generatedPdfBlob = null;
        let pdfBuildPromise = null;

        // ---- トースト表示ヘルパー ----
        let toastTimer = null;
        function showToast(message, type = 'default') {
            toast.textContent = message;
            toast.classList.remove('bg-slate-800', 'bg-green-600', 'bg-red-600');
            toast.classList.add(type === 'success' ? 'bg-green-600' : type === 'error' ? 'bg-red-600' : 'bg-slate-800');
            toast.classList.remove('opacity-0', 'translate-y-2');
            toast.classList.add('opacity-100', 'translate-y-0');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                toast.classList.remove('opacity-100', 'translate-y-0');
            }, 3200);
        }

        // リセット機能
        btnReset.addEventListener('click', () => {
            currentFile = null;
            isImageLoaded = false;
            isPdfMode = false;
            uploadedPdfBytes = null;
            ocrResultData = null;
            ocrResultScale = 1;
            pdfPageCanvases = [];
            pdfOcrResults = [];
            pdfOcrScales = [];
            generatedPdfBlob = null;
            pdfBuildPromise = null;

            previewImage.src = '';
            extractedText.value = '';

            document.querySelectorAll('.highlight-box').forEach(el => el.remove());

            uploadArea.classList.remove('hidden');
            processingArea.classList.add('hidden');
            processingArea.classList.remove('flex');
            resultTextArea.classList.add('hidden');
            resultTextArea.classList.remove('flex');
            progressContainer.classList.add('hidden');
            progressContainer.classList.remove('flex');
            btnRunOcr.disabled = false;
            btnRunOcr.classList.remove('opacity-50', 'cursor-not-allowed');
            btnReset.classList.add('hidden');

            fileInput.value = '';
        });

        // ドラッグ＆ドロップイベント
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('border-blue-500', 'bg-blue-50');
        });
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('border-blue-500', 'bg-blue-50');
        });
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('border-blue-500', 'bg-blue-50');
            if (e.dataTransfer.files.length > 0) {
                handleFile(e.dataTransfer.files[0]);
            }
        });
        // アップロードエリア全体のタップでファイル選択（ボタン以外の領域）
        uploadArea.addEventListener('click', (e) => {
            if (e.target.closest('button')) return;
            fileInput.click();
        });

        // ファイル選択イベント
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        async function handleFile(file) {
            if (!file) return;
            currentFile = file;
            isPdfMode = file.type === 'application/pdf';
            btnReset.classList.remove('hidden');

            uploadArea.classList.add('hidden');
            processingArea.classList.remove('hidden');
            processingArea.classList.add('flex');
            resultTextArea.classList.add('hidden');
            resultTextArea.classList.remove('flex');
            progressContainer.classList.add('hidden');
            document.querySelectorAll('.highlight-box').forEach(el => el.remove());

            if (isPdfMode) {
                // PDFファイルの読み込み（プレビュー用）
                try {
                    const arrayBuffer = await file.arrayBuffer();
                    uploadedPdfBytes = arrayBuffer;
                    const loadingTask = pdfjsLib.getDocument({ data: new Uint8Array(arrayBuffer) });
                    const pdf = await loadingTask.promise;

                    // 最初のページをプレビュー表示
                    const page = await pdf.getPage(1);
                    const viewport = page.getViewport({ scale: 1.5 });
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = viewport.width;
                    canvas.height = viewport.height;

                    await page.render({ canvasContext: ctx, viewport: viewport }).promise;

                    previewImage.onload = () => { isImageLoaded = true; };
                    previewImage.src = canvas.toDataURL('image/jpeg', 0.85);
                } catch (error) {
                    console.error("PDF preview error:", error);
                    showToast('PDFのプレビュー生成に失敗しました。', 'error');
                }
            } else {
                // 画像ファイルの読み込み
                const reader = new FileReader();
                reader.onload = (e) => {
                    previewImage.onload = () => { isImageLoaded = true; };
                    previewImage.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        // ---- OCR精度向上のための画像前処理 ----
        // グレースケール化＋コントラスト補正＋低解像度画像の拡大を行い、
        // OCRに適したCanvasと、元画像に対するスケール倍率を返す。
        function preprocessForOcr(source, srcWidth, srcHeight) {
            // 小さすぎる画像は文字が潰れて認識精度が落ちるため拡大する。
            // 反対に巨大な画像は処理が重くなるので上限も設ける。
            const targetMinSide = 1600;   // 短辺がこの値になるまで拡大
            const maxSide = 3500;         // 長辺の上限
            const minSide = Math.min(srcWidth, srcHeight);
            let scale = 1;
            if (minSide < targetMinSide) {
                scale = targetMinSide / minSide;
            }
            // 上限クリップ
            if (Math.max(srcWidth, srcHeight) * scale > maxSide) {
                scale = maxSide / Math.max(srcWidth, srcHeight);
            }
            if (scale < 1 && Math.max(srcWidth, srcHeight) <= maxSide) {
                scale = 1; // 縮小はしない（十分な解像度がある場合）
            }

            const canvas = document.createElement('canvas');
            canvas.width = Math.round(srcWidth * scale);
            canvas.height = Math.round(srcHeight * scale);
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
            ctx.drawImage(source, 0, 0, canvas.width, canvas.height);

            // グレースケール化 + コントラスト強調
            try {
                const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const d = imgData.data;
                const contrast = 1.25;                     // コントラスト係数
                const intercept = 128 * (1 - contrast);
                for (let i = 0; i < d.length; i += 4) {
                    // 輝度に変換（グレースケール）
                    let gray = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
                    // コントラスト補正
                    gray = gray * contrast + intercept;
                    gray = gray < 0 ? 0 : gray > 255 ? 255 : gray;
                    d[i] = d[i + 1] = d[i + 2] = gray;
                }
                ctx.putImageData(imgData, 0, 0);
            } catch (e) {
                // getImageDataが失敗した場合（稀）はグレースケール化なしで続行
                console.warn('preprocess skipped:', e);
            }

            return { canvas, scale };
        }

        // 日本語文字列に含まれる不要な半角スペースをループで徹底的に除去する関数
        function removeUnnaturalSpaces(text) {
            let previousText = "";
            let currentText = text;

            while (currentText !== previousText) {
                previousText = currentText;
                // 1. 全角文字同士の間の半角スペースを削除
                currentText = currentText.replace(/([^\x01-\x7E\xA1-\xDF])\s+([^\x01-\x7E\xA1-\xDF])/g, '$1$2');
                // 2. 全角文字と半角英数字の間の半角スペースを削除
                currentText = currentText.replace(/([^\x01-\x7E\xA1-\xDF])\s+([a-zA-Z0-9])/g, '$1$2');
                currentText = currentText.replace(/([a-zA-Z0-9])\s+([^\x01-\x7E\xA1-\xDF])/g, '$1$2');
            }

            currentText = currentText.replace(/^\s+/gm, '').replace(/\s+$/gm, '');
            currentText = currentText.replace(/\s*([。、，．])\s*/g, '$1');

            return currentText;
        }

        btnRunOcr.addEventListener('click', async () => {
            if (isPdfMode) {
                if (!uploadedPdfBytes) return;
            } else {
                if (!isImageLoaded) return;
            }

            // UI更新
            btnRunOcr.disabled = true;
            btnRunOcr.classList.add('opacity-50', 'cursor-not-allowed');
            progressContainer.classList.remove('hidden');
            progressContainer.classList.add('flex');
            resultTextArea.classList.add('hidden');
            resultTextArea.classList.remove('flex');
            document.querySelectorAll('.highlight-box').forEach(el => el.remove());

            // 選択された言語設定を取得
            let selectedLang = 'jpn+eng';
            radioDirections.forEach(radio => {
                if (radio.checked) selectedLang = radio.value;
            });
            const isVertical = selectedLang === 'jpn_vert';

            let worker = null;

            try {
                progressText.textContent = 'OCRエンジンを読み込み中...';
                worker = await Tesseract.createWorker({
                    logger: m => {
                        if (m.status === 'recognizing text') {
                            const progress = Math.round(m.progress * 100);
                            progressBar.style.width = `${progress}%`;
                            progressPercent.textContent = `${progress}%`;
                        }
                    }
                });

                progressText.textContent = '辞書データを準備中...';
                await worker.loadLanguage(selectedLang);
                await worker.initialize(selectedLang);

                // 認識精度向上のためのパラメータ設定
                await worker.setParameters({
                    // ページセグメンテーション：縦書きは縦書き専用、横書きは自動
                    tessedit_pageseg_mode: isVertical ? '5' : '3',
                    // 単語間スペースを保持（日本語の後処理で除去する）
                    preserve_interword_spaces: '1',
                    // DPI未指定による警告と精度低下を防ぐ
                    user_defined_dpi: '300',
                });

                if (isPdfMode) {
                    // --- PDF（複数ページ）のOCR処理 ---
                    const loadingTask = pdfjsLib.getDocument({ data: new Uint8Array(uploadedPdfBytes) });
                    const pdf = await loadingTask.promise;
                    const numPages = pdf.numPages;
                    pdfPageCanvases = [];
                    pdfOcrResults = [];
                    pdfOcrScales = [];
                    let combinedText = '';

                    for (let i = 1; i <= numPages; i++) {
                        progressText.textContent = `ページ ${i}/${numPages} を処理中...`;

                        const page = await pdf.getPage(i);
                        const renderScale = 2.0; // PDF背景・OCRベースの描画スケール
                        const viewport = page.getViewport({ scale: renderScale });
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        canvas.width = viewport.width;
                        canvas.height = viewport.height;

                        await page.render({ canvasContext: ctx, viewport: viewport }).promise;
                        pdfPageCanvases.push(canvas); // PDF生成時用にカラーCanvasを保存

                        // 前処理してOCR（bbox座標は preScale で割ると canvas 座標に戻る）
                        const { canvas: ocrCanvas, scale: preScale } = preprocessForOcr(canvas, canvas.width, canvas.height);
                        const ret = await worker.recognize(ocrCanvas);

                        pdfOcrResults.push(ret);
                        pdfOcrScales.push(preScale);

                        // 信頼度に基づくテキスト抽出とスペース除去
                        let pageText = '';
                        if (ret.data && ret.data.lines) {
                            ret.data.lines.forEach(line => {
                                let validWords = line.words.filter(w => w.confidence >= CONFIDENCE_THRESHOLD);
                                if (validWords.length > 0) {
                                    let rawLineText = validWords.map(w => w.text).join(' ');
                                    pageText += removeUnnaturalSpaces(rawLineText) + '\n';
                                }
                            });
                        }
                        combinedText += `--- ページ ${i} ---\n${pageText}\n`;
                    }

                    extractedText.value = combinedText.trim();

                } else {
                    // --- 画像（単一ページ）のOCR処理 ---
                    progressText.textContent = '文字を認識中...';

                    // 前処理（グレースケール・コントラスト・拡大）を施した画像でOCR
                    const { canvas: ocrCanvas, scale: preScale } = preprocessForOcr(
                        previewImage, previewImage.naturalWidth, previewImage.naturalHeight
                    );
                    const ret = await worker.recognize(ocrCanvas);

                    ocrResultData = ret;
                    ocrResultScale = preScale;

                    let finalExtractedText = "";

                    if (ret.data && ret.data.lines) {
                        ret.data.lines.forEach(line => {
                            let validWords = line.words.filter(w => w.confidence >= CONFIDENCE_THRESHOLD);

                            if (validWords.length > 0) {
                                // ハイライト枠（bbox座標を preScale で割って元画像座標へ）
                                const minX = Math.min(...validWords.map(w => w.bbox.x0)) / preScale;
                                const minY = Math.min(...validWords.map(w => w.bbox.y0)) / preScale;
                                const maxX = Math.max(...validWords.map(w => w.bbox.x1)) / preScale;
                                const maxY = Math.max(...validWords.map(w => w.bbox.y1)) / preScale;

                                const box = document.createElement('div');
                                box.className = 'highlight-box';
                                box.style.left = `${(minX / previewImage.naturalWidth) * 100}%`;
                                box.style.top = `${(minY / previewImage.naturalHeight) * 100}%`;
                                box.style.width = `${((maxX - minX) / previewImage.naturalWidth) * 100}%`;
                                box.style.height = `${((maxY - minY) / previewImage.naturalHeight) * 100}%`;
                                previewContainer.appendChild(box);

                                let rawLineText = validWords.map(w => w.text).join(' ');
                                finalExtractedText += removeUnnaturalSpaces(rawLineText) + "\n";
                            }
                        });
                    }
                    extractedText.value = finalExtractedText.trim();
                }

                progressText.textContent = '完了！';
                progressBar.style.width = '100%';
                progressPercent.textContent = '100%';
                resultTextArea.classList.remove('hidden');
                resultTextArea.classList.add('flex');
                showToast('テキストの認識が完了しました', 'success');

                // 保存ボタンを即座に押せるよう、PDFを裏で先に生成しておく
                schedulePdfBuild();

            } catch (error) {
                console.error(error);
                showToast('OCR処理中にエラーが発生しました', 'error');
            } finally {
                if (worker) {
                    try { await worker.terminate(); } catch (e) {}
                }
                btnRunOcr.disabled = false;
                btnRunOcr.classList.remove('opacity-50', 'cursor-not-allowed');
                setTimeout(() => {
                    progressContainer.classList.add('hidden');
                    progressContainer.classList.remove('flex');
                    progressBar.style.width = '0%';
                    progressPercent.textContent = '0%';
                }, 1800);
            }
        });

        btnCopy.addEventListener('click', async () => {
            const text = extractedText.value;
            let ok = false;
            try {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    await navigator.clipboard.writeText(text);
                    ok = true;
                }
            } catch (e) { /* フォールバックへ */ }
            if (!ok) {
                extractedText.select();
                try { ok = document.execCommand('copy'); } catch (e) {}
                window.getSelection().removeAllRanges();
            }
            showToast(ok ? 'テキストをコピーしました' : 'コピーに失敗しました', ok ? 'success' : 'error');
        });

        // Canvasを安全にバイナリ配列に変換するヘルパー関数
        async function getCanvasBytes(canvas) {
            return new Promise((resolve, reject) => {
                canvas.toBlob(async (blob) => {
                    if (!blob) { reject(new Error("Canvas blob conversion failed")); return; }
                    const arrayBuffer = await blob.arrayBuffer();
                    resolve(new Uint8Array(arrayBuffer));
                }, 'image/jpeg', 0.9);
            });
        }

        // OCR結果からOCR対応PDFを生成し、Blobを返す
        async function buildPdfBlob() {
            const pdfDoc = await PDFLib.PDFDocument.create();
            pdfDoc.registerFontkit(window.fontkit);

            // 日本語フォントを取得
            const fontUrl = 'https://cdn.jsdelivr.net/npm/typeface-notosans-jp@1.0.1/NotoSansJP-Regular.otf';
            let fontBytes;
            try {
                const fontRes = await fetch(fontUrl);
                if (!fontRes.ok) throw new Error(`HTTP error! status: ${fontRes.status}`);
                fontBytes = await fontRes.arrayBuffer();
            } catch (fetchErr) {
                console.error("Font fetch error:", fetchErr);
                throw new Error("日本語フォントのダウンロードに失敗しました。通信環境を確認してください。");
            }
            const customFont = await pdfDoc.embedFont(fontBytes);

            // --- 共通のページ生成処理関数 ---
            // ocrScale: OCR結果のbbox座標を画像座標へ戻す倍率
            async function createPdfPage(pdfDoc, imgBytes, imgWidth, imgHeight, ocrResult, ocrScale, font) {
                const page = pdfDoc.addPage([imgWidth, imgHeight]);
                const pdfImage = await pdfDoc.embedJpg(imgBytes);

                page.drawImage(pdfImage, { x: 0, y: 0, width: imgWidth, height: imgHeight });

                if (ocrResult && ocrResult.data && ocrResult.data.lines) {
                    ocrResult.data.lines.forEach(line => {
                        let validWords = line.words.filter(w => w.confidence >= CONFIDENCE_THRESHOLD);
                        if (validWords.length === 0) return;

                        validWords.forEach(word => {
                            let text = removeUnnaturalSpaces(word.text).replace(/\n/g, '').trim();
                            if (!text) return;

                            // bbox座標を画像座標系へ変換
                            const x0 = word.bbox.x0 / ocrScale;
                            const y0 = word.bbox.y0 / ocrScale;
                            const x1 = word.bbox.x1 / ocrScale;
                            const y1 = word.bbox.y1 / ocrScale;
                            const lineWidth = x1 - x0;
                            const lineHeight = y1 - y0;
                            if (lineWidth <= 0 || lineHeight <= 0) return;

                            const fontSize = lineHeight * 0.8;
                            const textWidth = font.widthOfTextAtSize(text, fontSize);

                            let scaleX = 1;
                            if (textWidth > 0) {
                                scaleX = lineWidth / textWidth;
                            }

                            const yPos = imgHeight - y1 + (lineHeight * 0.1);

                            page.pushOperators(
                                PDFLib.pushGraphicsState(),
                                PDFLib.concatTransformationMatrix(scaleX, 0, 0, 1, x0, yPos)
                            );

                            page.drawText(text, {
                                x: 0,
                                y: 0,
                                size: fontSize,
                                font: font,
                                color: PDFLib.rgb(0, 0, 0),
                                opacity: 0, // 完全に透明
                            });

                            page.pushOperators(PDFLib.popGraphicsState());
                        });
                    });
                }
            }

            if (isPdfMode) {
                // --- 複数ページ（PDF）モード ---
                for (let i = 0; i < pdfPageCanvases.length; i++) {
                    const canvas = pdfPageCanvases[i];
                    const result = pdfOcrResults[i];
                    const scale = pdfOcrScales[i] || 1;
                    const imgBytes = await getCanvasBytes(canvas);
                    await createPdfPage(pdfDoc, imgBytes, canvas.width, canvas.height, result, scale, customFont);
                }
            } else {
                // --- 単一画像モード ---
                const canvas = document.createElement('canvas');
                canvas.width = previewImage.naturalWidth;
                canvas.height = previewImage.naturalHeight;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(previewImage, 0, 0);
                const imgBytes = await getCanvasBytes(canvas);

                await createPdfPage(pdfDoc, imgBytes, canvas.width, canvas.height, ocrResultData, ocrResultScale, customFont);
            }

            const pdfBytes = await pdfDoc.save();
            return new Blob([pdfBytes], { type: 'application/pdf' });
        }

        // OCR完了後、保存ボタンを押した瞬間に共有できるようPDFを先行生成しておく
        function schedulePdfBuild() {
            generatedPdfBlob = null;
            pdfBuildPromise = buildPdfBlob()
                .then(blob => { generatedPdfBlob = blob; return blob; })
                .catch(err => {
                    // エラーは実際に保存を押したときに表示する
                    console.error('PDF pre-build error:', err);
                    pdfBuildPromise = null;
                    throw err;
                });
            // 未処理のPromise拒否として警告が出ないように無害化
            pdfBuildPromise.catch(() => {});
        }

        // 生成済みのPDFを端末へ渡す。
        // スマホでは共有/保存シート（Web Share API）を使い、保存先を選べてアプリに戻れるようにする。
        // PC等では従来どおりファイルとしてダウンロードする。
        async function deliverPdf(blob, fileName) {
            const ua = navigator.userAgent || '';
            const isIOS = /iP(hone|ad|od)/.test(ua) ||
                          (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
            const isMobile = isIOS || /Android/.test(ua);

            // モバイル：ネイティブの共有/保存シートを使う
            if (isMobile && navigator.canShare) {
                try {
                    const file = new File([blob], fileName, { type: 'application/pdf' });
                    if (navigator.canShare({ files: [file] })) {
                        await navigator.share({ files: [file], title: fileName });
                        showToast('PDFを保存/共有しました', 'success');
                        return;
                    }
                } catch (e) {
                    if (e && e.name === 'AbortError') {
                        // ユーザーが共有をキャンセル：そのままアプリ画面に戻るだけ
                        return;
                    }
                    // それ以外は通常ダウンロードへフォールバック
                    console.warn('share failed, fallback to download:', e);
                }
            }

            // フォールバック：通常のファイルダウンロード
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName;
            if (isIOS) {
                // iOS Safariで同一タブ遷移してアプリに戻れなくなるのを避ける
                a.target = '_blank';
                a.rel = 'noopener';
            }
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            // モバイルでは即時revokeするとダウンロード/表示が中断されるため遅延させる
            setTimeout(() => URL.revokeObjectURL(url), 60000);
            showToast('PDFを保存しました（「ダウンロード」／「ファイル」をご確認ください）', 'success');
        }

        btnSavePdf.addEventListener('click', async () => {
            // UI更新（ローディング表示）
            btnSavePdf.disabled = true;
            btnSavePdf.classList.add('opacity-80', 'cursor-not-allowed');
            pdfBtnText.innerHTML = '<span class="spinner"></span>作成中...';

            try {
                // 先行生成が済んでいれば即座に、まだなら生成を待って取得する
                let blob = generatedPdfBlob;
                if (!blob) {
                    blob = pdfBuildPromise ? await pdfBuildPromise : await buildPdfBlob();
                }
                await deliverPdf(blob, 'ocr_converted.pdf');
            } catch (error) {
                console.error('PDF Generation Error:', error);
                showToast(error.message || 'PDFの作成中にエラーが発生しました', 'error');
            } finally {
                btnSavePdf.disabled = false;
                btnSavePdf.classList.remove('opacity-80', 'cursor-not-allowed');
                pdfBtnText.textContent = 'OCR対応PDFを保存';
            }
        });
    </script>
</body>
</html>
