<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OCR対応 PDFコンバーター</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Tesseract.js (OCRエンジン) -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    
    <!-- PDF-lib (PDF生成) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
    <script src="https://unpkg.com/@pdf-lib/fontkit@0.0.4/dist/fontkit.umd.js"></script>
    
    <!-- PDF.js (PDFの画像化と読み込み) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>

    <style>
        body { font-family: 'Inter', 'Noto Sans JP', sans-serif; background-color: #f3f4f6; }
        .drag-active { background-color: #e0e7ff; border-color: #4f46e5; }
        /* スクロールバーのカスタマイズ */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex flex-col items-center">

    <div class="w-full max-w-4xl bg-white rounded-2xl shadow-xl overflow-hidden">
        <!-- ヘッダー -->
        <div class="bg-indigo-600 text-white p-6 text-center">
            <h1 class="text-2xl font-bold mb-2">OCR対応 PDFコンバーター</h1>
            <p class="text-indigo-100 text-sm">画像またはPDFをアップロードして、テキストが検索・コピー可能なPDFに変換します</p>
        </div>

        <div class="p-6 md:p-8">
            
            <!-- ステップ1: ファイルアップロード -->
            <div id="step-upload" class="space-y-4">
                <div id="dropzone" class="border-2 border-dashed border-gray-300 rounded-xl p-12 text-center transition-colors duration-200 cursor-pointer hover:bg-gray-50">
                    <svg class="mx-auto h-12 w-12 text-gray-400 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                    </svg>
                    <p class="text-gray-600 font-medium text-lg">画像またはPDFファイルをここにドロップ</p>
                    <p class="text-gray-400 text-sm mt-2">対応形式: JPG, PNG, PDF</p>
                    <input type="file" id="file-input" class="hidden" accept="image/*,application/pdf">
                    <button class="mt-6 bg-indigo-100 text-indigo-700 px-6 py-2 rounded-lg font-semibold hover:bg-indigo-200 transition">ファイルを選択</button>
                </div>
            </div>

            <!-- ステップ2: プレビューと実行 -->
            <div id="step-preview" class="hidden space-y-6">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-bold text-gray-800">プレビュー</h2>
                    <button id="btn-reset" class="text-sm flex items-center text-gray-500 hover:text-red-500 transition-colors">
                        <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                        最初からやり直す
                    </button>
                </div>
                
                <div class="bg-gray-100 rounded-lg p-2 flex justify-center max-h-96 overflow-hidden">
                    <img id="preview-image" class="object-contain h-full max-w-full rounded shadow-sm" alt="プレビュー">
                </div>
                
                <div class="flex justify-center">
                    <button id="btn-run-ocr" class="bg-indigo-600 text-white px-8 py-3 rounded-full font-bold text-lg shadow-lg hover:bg-indigo-700 hover:shadow-xl transition-all transform hover:-translate-y-1 w-full md:w-auto flex justify-center items-center">
                        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>
                        OCRを実行して変換
                    </button>
                </div>
            </div>

            <!-- ステップ3: 結果 -->
            <div id="step-results" class="hidden mt-8 space-y-6 border-t pt-8">
                <div class="flex flex-col items-center justify-center p-4 bg-indigo-50 rounded-lg border border-indigo-100">
                    <p id="progress-text" class="text-indigo-800 font-medium mb-2">準備中...</p>
                    <!-- プログレスバー風のアニメーション -->
                    <div class="w-full max-w-md bg-indigo-200 rounded-full h-2.5 overflow-hidden">
                        <div id="progress-bar" class="bg-indigo-600 h-2.5 rounded-full w-0 transition-all duration-300"></div>
                    </div>
                </div>

                <div id="result-actions" class="hidden space-y-6">
                    <div>
                        <div class="flex justify-between items-center mb-2">
                            <h3 class="font-bold text-gray-700">抽出されたテキスト (プレビュー)</h3>
                            <button id="btn-copy-text" class="text-sm bg-gray-200 text-gray-700 px-3 py-1 rounded hover:bg-gray-300 transition">テキストのみコピー</button>
                        </div>
                        <textarea id="result-textarea" class="w-full h-48 p-4 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none resize-y text-sm leading-relaxed" readonly></textarea>
                    </div>

                    <div class="flex justify-center pt-4">
                        <button id="btn-save-pdf" class="bg-green-600 text-white px-8 py-3 rounded-full font-bold text-lg shadow-lg hover:bg-green-700 hover:shadow-xl transition-all transform hover:-translate-y-1 w-full md:w-auto flex justify-center items-center">
                            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                            <span>OCR対応PDFとして保存</span>
                        </button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        // DOM要素
        const dropzone = document.getElementById('dropzone');
        const fileInput = document.getElementById('file-input');
        const stepUpload = document.getElementById('step-upload');
        const stepPreview = document.getElementById('step-preview');
        const stepResults = document.getElementById('step-results');
        const resultActions = document.getElementById('result-actions');
        const previewImage = document.getElementById('preview-image');
        const progressText = document.getElementById('progress-text');
        const progressBar = document.getElementById('progress-bar');
        const resultTextarea = document.getElementById('result-textarea');
        
        // 状態変数
        let isPdfMode = false;
        let uploadedPdfBytes = null;
        let originalImageWidth = 0;
        let originalImageHeight = 0;
        let pdfPagesImages = []; // Canvas要素を格納
        let pdfOcrResults = [];  // Tesseractのパース結果を格納

        // 不自然な半角スペースを除去する関数
        function removeUnnaturalSpaces(text) {
            if (!text) return '';
            // 日本語と日本語の間、日本語と英数字の間の半角スペースを削除
            let res = text.replace(/([あ-んア-ン一-龥ー])\s+([あ-んア-ン一-龥ーa-zA-Z0-9])/g, '$1$2');
            res = res.replace(/([a-zA-Z0-9])\s+([あ-んア-ン一-龥ー])/g, '$1$2');
            // 余分なスペースの連続を一つに
            res = res.replace(/ {2,}/g, ' ');
            return res;
        }

        // 初期状態にリセットする関数
        function resetState() {
            isPdfMode = false;
            uploadedPdfBytes = null;
            pdfPagesImages = [];
            pdfOcrResults = [];
            previewImage.src = '';
            resultTextarea.value = '';
            
            stepPreview.classList.add('hidden');
            stepResults.classList.add('hidden');
            resultActions.classList.add('hidden');
            stepUpload.classList.remove('hidden');
            
            progressBar.style.width = '0%';
            fileInput.value = ''; // ファイル選択をクリア
        }

        // リセットボタンのイベント
        document.getElementById('btn-reset').addEventListener('click', resetState);

        // ファイル処理関数
        async function handleFile(file) {
            if (!file) return;
            resetState();
            
            const fileType = file.type;
            
            stepUpload.classList.add('hidden');
            stepPreview.classList.remove('hidden');
            
            if (fileType === 'application/pdf') {
                isPdfMode = true;
                try {
                    // PDFをバイナリとしてメモリに保持
                    uploadedPdfBytes = await file.arrayBuffer();
                    
                    // プレビュー用にPDF.jsで1ページ目をレンダリング
                    const loadingTask = pdfjsLib.getDocument({ data: new Uint8Array(uploadedPdfBytes) });
                    const pdf = await loadingTask.promise;
                    const page = await pdf.getPage(1);
                    const viewport = page.getViewport({ scale: 1.0 });
                    
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = viewport.width;
                    canvas.height = viewport.height;
                    
                    await page.render({ canvasContext: ctx, viewport: viewport }).promise;
                    
                    previewImage.src = canvas.toDataURL('image/jpeg');
                    originalImageWidth = canvas.width;
                    originalImageHeight = canvas.height;
                } catch (error) {
                    alert('PDFの読み込みに失敗しました。\n詳細: ' + error.message);
                    resetState();
                }
            } else if (fileType.startsWith('image/')) {
                isPdfMode = false;
                const url = URL.createObjectURL(file);
                
                previewImage.onload = () => {
                    originalImageWidth = previewImage.naturalWidth;
                    originalImageHeight = previewImage.naturalHeight;
                    URL.revokeObjectURL(url); // メモリ解放
                };
                previewImage.src = url;
            } else {
                alert('対応していないファイル形式です。画像(JPG/PNG)またはPDFを選択してください。');
                resetState();
            }
        }

        // ドラッグ＆ドロップのイベント
        dropzone.addEventListener('click', () => fileInput.click());
        dropzone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropzone.classList.add('drag-active');
        });
        dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag-active'));
        dropzone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropzone.classList.remove('drag-active');
            if (e.dataTransfer.files.length > 0) {
                handleFile(e.dataTransfer.files[0]);
            }
        });
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) handleFile(e.target.files[0]);
        });

        document.getElementById('btn-run-ocr').addEventListener('click', async () => {
            stepResults.classList.remove('hidden');
            resultActions.classList.add('hidden');
            progressBar.style.width = '10%';
            progressText.textContent = 'OCRエンジンを準備中...';
            
            try {
                // Tesseractのワーカーを生成
                const worker = await Tesseract.createWorker('jpn');
                let combinedText = '';
                
                pdfPagesImages = [];
                pdfOcrResults = [];
                
                if (isPdfMode) {
                    // --- PDFの場合: 全ページを処理 ---
                    const loadingTask = pdfjsLib.getDocument({ data: new Uint8Array(uploadedPdfBytes) });
                    const pdf = await loadingTask.promise;
                    const numPages = pdf.numPages;
                    
                    for (let i = 1; i <= numPages; i++) {
                        progressBar.style.width = `${10 + (80 * (i / numPages))}%`;
                        progressText.textContent = `ページ ${i} / ${numPages} をOCR処理中...`;
                        
                        const page = await pdf.getPage(i);
                        // OCR用と最終PDF出力用に、適度なスケール（2.0）で描画
                        const viewport = page.getViewport({ scale: 2.0 });
                        
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        canvas.width = viewport.width;
                        canvas.height = viewport.height;
                        await page.render({ canvasContext: ctx, viewport: viewport }).promise;
                        
                        pdfPagesImages.push(canvas); // 画像データを保持
                        
                        // メモリ効率化のためCanvasをそのままTesseractに渡す
                        const ret = await worker.recognize(canvas);
                        pdfOcrResults.push(ret);
                        
                        combinedText += `--- ページ ${i} ---\n`;
                        combinedText += removeUnnaturalSpaces(ret.data.text) + '\n\n';
                    }
                } else {
                    // --- 画像の場合: 1枚だけ処理 ---
                    progressBar.style.width = '50%';
                    progressText.textContent = '画像をOCR処理中...';
                    
                    // 現在の画像をCanvasに描画して保持
                    const canvas = document.createElement('canvas');
                    canvas.width = originalImageWidth;
                    canvas.height = originalImageHeight;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(previewImage, 0, 0);
                    pdfPagesImages.push(canvas);
                    
                    const ret = await worker.recognize(canvas);
                    pdfOcrResults.push(ret);
                    
                    combinedText = removeUnnaturalSpaces(ret.data.text);
                }
                
                await worker.terminate();
                
                // 結果の表示
                resultTextarea.value = combinedText;
                progressBar.style.width = '100%';
                progressText.textContent = 'OCR処理が完了しました！';
                resultActions.classList.remove('hidden');
                
            } catch (error) {
                console.error('OCR Error:', error);
                alert('OCR処理中にエラーが発生しました。\n詳細: ' + error.message);
                progressText.textContent = 'エラーが発生しました';
            }
        });

        // テキストコピー
        document.getElementById('btn-copy-text').addEventListener('click', () => {
            resultTextarea.select();
            document.execCommand('copy');
            const btn = document.getElementById('btn-copy-text');
            const originalText = btn.textContent;
            btn.textContent = 'コピーしました！';
            setTimeout(() => { btn.textContent = originalText; }, 2000);
        });

        // Canvasからバイナリを取得する補助関数（メモリクラッシュ防止）
        async function getCanvasBytes(canvas) {
            return new Promise((resolve, reject) => {
                canvas.toBlob(async (blob) => {
                    if (!blob) reject(new Error('Canvasから画像の生成に失敗しました'));
                    resolve(new Uint8Array(await blob.arrayBuffer()));
                }, 'image/jpeg', 0.9);
            });
        }

        // PDFの直接生成とダウンロード (pdf-lib)
        const btnSavePdf = document.getElementById('btn-save-pdf');
        btnSavePdf.addEventListener('click', async () => {
            const btnText = btnSavePdf.querySelector('span');
            const originalHtml = btnSavePdf.innerHTML;
            
            // ボタンをローディング状態にする
            btnSavePdf.innerHTML = '<svg class="animate-spin w-5 h-5 mr-2" viewBox="0 0 24 24" fill="none"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> PDFを作成中...';
            btnSavePdf.disabled = true;
            
            try {
                const { PDFDocument, rgb } = PDFLib;
                const pdfDoc = await PDFDocument.create();
                
                // 日本語フォントを利用するための登録
                pdfDoc.registerFontkit(window.fontkit);
                
                // --- 修正: より安定したCDNから日本語フォントを取得 ---
                const fontUrl = 'https://cdn.jsdelivr.net/npm/typeface-notosans-jp/NotoSansJP-Regular.otf';
                const fontBytes = await fetch(fontUrl).then(res => {
                    if (!res.ok) throw new Error(`フォントの取得に失敗しました: ${res.status} ${res.statusText}`);
                    return res.arrayBuffer();
                });
                const customFont = await pdfDoc.embedFont(fontBytes);
                
                if (isPdfMode) {
                    const imgBytes = await getCanvasBytes(canvas);
                    const pdfImage = await pdfDoc.embedJpg(imgBytes);
                    
                    // キャンバスと同じピクセルサイズでページを作成
                    const page = pdfDoc.addPage([canvas.width, canvas.height]);
                    
                    // 背景として画像を描画
                    page.drawImage(pdfImage, {
                        x: 0,
                        y: 0,
                        width: canvas.width,
                        height: canvas.height,
                    });
                    
                    // 行(Line)単位で透明なテキストを配置
                    // 単語単位だと順序がおかしくなるため、行単位で処理
                    if (ocrResult && ocrResult.data && ocrResult.data.lines) {
                        ocrResult.data.lines.forEach(line => {
                            const text = removeUnnaturalSpaces(line.text);
                            const bbox = line.bbox;
                            
                            // PDFの座標系は左下が原点 (0,0) のため、CanvasのY座標を変換
                            const pdfY = canvas.height - bbox.y1;
                            // 高さからフォントサイズを推測 (少し小さめに設定してはみ出しを防止)
                            const fontSize = (bbox.y1 - bbox.y0) * 0.8;
                            
                            try {
                                page.drawText(text, {
                                    x: bbox.x0,
                                    y: pdfY,
                                    size: fontSize,
                                    font: customFont,
                                    color: rgb(0, 0, 0),
                                    opacity: 0, // 透明度0で完全に見えないが、選択可能
                                });
                            } catch (e) {
                                console.warn('テキスト配置スキップ (認識不能文字):', text);
                            }
                        });
                    }
                }
                
                // PDFの保存とダウンロード処理
                const pdfBytesToSave = await pdfDoc.save();
                const blob = new Blob([pdfBytesToSave], { type: 'application/pdf' });
                const url = URL.createObjectURL(blob);
                
                const a = document.createElement('a');
                a.href = url;
                a.download = isPdfMode ? 'ocr_added_document.pdf' : 'ocr_converted.pdf';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                
            } catch (error) {
                console.error('PDF Generation Error:', error);
                alert('PDFの作成中にエラーが発生しました。\n(※初回は日本語フォントのダウンロードに数秒かかる場合があります)\n詳細: ' + error.message);
            } finally {
                // ボタンの状態を元に戻す
                btn.innerHTML = originalHtml;
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
